name: Release

on:
  workflow_dispatch:
    inputs:
      arm64_only:
        description: 'Build only the arm64-v8a APK (skip the universal APK)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: app/src/main/release.jks
      KEYSTORE_PASSWORD: aether123456
      KEY_ALIAS: aetherst
      KEY_PASSWORD: aether123456

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p app/src/main
          if [ ! -f "app/src/main/release.jks" ]; then
            echo "==> Creating permanent 10-year keystore on GitHub runner..."
            keytool -genkey -v \
              -keystore app/src/main/release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias aetherst \
              -storepass aether123456 \
              -keypass aether123456 \
              -dname "CN=AetherST, OU=Dev, O=Aether, C=IR"

            echo "==> Committing permanent keystore to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/src/main/release.jks
            git commit -m "ci: add permanent keystore for seamless app updates [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || git push origin HEAD:main || true
          else
            echo "==> Permanent keystore already exists. Using existing key."
          fi

      - name: Strip native binaries to minimize APK size
        run: |
          find app/src/main/jniLibs -name "*.so" -exec strip --strip-unneeded {} + 2>/dev/null || true

      - name: Build Android Release APK
        env:
          ORG_GRADLE_PROJECT_arm64Only: ${{ inputs.arm64_only && 'true' || 'false' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.arm64_only && 'AetherST-Android-arm64-v8a' || 'AetherST-Android' }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 3

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
