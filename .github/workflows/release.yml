name: Release

on:
  workflow_dispatch:
    inputs:
      arm64_only:
        description: 'Build only the arm64-v8a APK (skip the universal APK)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  exit-tests:
    name: Loopback chain tests
    if: inputs.arm64_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Accept Android SDK licenses for the test build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Exercise both exits (Android local unit tests)
        shell: bash
        run: |
          set -o pipefail
          if ! bash tools/exit-test/run.sh 2>&1 | tee "$RUNNER_TEMP/exit-tests.log"; then
            python3 - <<'DIAG'
          import os, pathlib
          lines = pathlib.Path(os.environ['RUNNER_TEMP'], 'exit-tests.log').read_text(errors='replace').splitlines()
          for line in [l for l in lines if l.strip() and not l.startswith('::')][-25:]:
              print('::error title=Loopback diagnostics::' + line[:750].replace('%', '%25'))
          DIAG
            exit 1
          fi
      - name: Report each loopback test
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          cases = [t for f in glob.glob('composeApp/build/test-results/testReleaseUnitTest/TEST-*.xml') for t in ET.parse(f).iter('testcase')]
          for t in cases:
              bad = next((x for x in t if x.tag in ('failure', 'error', 'skipped')), None)
              print(f"::{'error' if bad is not None else 'notice'} title=Loopback test::{t.get('name')}: {bad.get('message', bad.tag)[:300] if bad is not None else 'PASS'}")
          assert {'ExitTunnelTest','WireGuardDataPlaneTest'} <= {t.get('classname','').split('.')[-1] for t in cases}
          assert not any(t.find(k) is not None for t in cases for k in ('failure','error','skipped')), 'Expected the data-plane tests to run and pass'
          PYTEST

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: app/src/main/release.jks
      KEYSTORE_PASSWORD: aether123456
      KEY_ALIAS: aetherst
      KEY_PASSWORD: aether123456

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p app/src/main
          if [ ! -f "app/src/main/release.jks" ]; then
            echo "==> Creating permanent 10-year keystore on GitHub runner..."
            keytool -genkey -v \
              -keystore app/src/main/release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias aetherst \
              -storepass aether123456 \
              -keypass aether123456 \
              -dname "CN=AetherST, OU=Dev, O=Aether, C=IR"

            echo "==> Committing permanent keystore to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/src/main/release.jks
            git commit -m "ci: add permanent keystore for seamless app updates [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || git push origin HEAD:main || true
          else
            echo "==> Permanent keystore already exists. Using existing key."
          fi

      - name: Strip native binaries to minimize APK size
        run: |
          find app/src/main/jniLibs -name "*.so" -exec strip --strip-unneeded {} + 2>/dev/null || true

      - name: Build Android Release APK
        env:
          ORG_GRADLE_PROJECT_arm64Only: ${{ inputs.arm64_only && 'true' || 'false' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Check test APK ABI
        if: inputs.arm64_only
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          test "$(unzip -Z1 "${apks[0]}" | awk -F/ '/^lib\/.*\.so$/ {print $2}' | sort -u)" = arm64-v8a
          sha256sum "${apks[0]}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.arm64_only && 'AetherST-Android-arm64-v8a' || 'AetherST-Android' }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 3

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
