name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-windows'
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradle
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Prepare Binaries and Resources
        shell: bash
        run: |
          mkdir -p composeApp/src/desktopMain/resources/bin

          # دانلود باینری رسمی سایفون اگر از قبل نباشد
          if [ ! -f "composeApp/src/desktopMain/resources/bin/psiphon-tunnel-core.exe" ]; then
            echo "Downloading Psiphon tunnel core..."
            curl -L -f -o composeApp/src/desktopMain/resources/bin/psiphon-tunnel-core.exe https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/master/windows/psiphon-tunnel-core-i686.exe
          fi

          # کپی فایل سرورها از پوشه اندروید به منابع دسکتاپ
          if [ -f "app/src/main/assets/server_entries.txt" ]; then
            cp app/src/main/assets/server_entries.txt composeApp/src/desktopMain/resources/server_entries.txt
            cp app/src/main/assets/server_entries.txt composeApp/src/desktopMain/resources/bin/server_entries.txt
          fi

          # فشرده‌سازی باینری‌ها با UPX برای کاهش چشمگیر حجم نصبی
          echo "=== Compressing binaries with UPX ==="
          curl -L -f -s -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          unzip -q -o upx.zip
          ./upx-4.2.4-win64/upx.exe --best --lzma composeApp/src/desktopMain/resources/bin/sing-box.exe || true
          ./upx-4.2.4-win64/upx.exe --best --lzma composeApp/src/desktopMain/resources/bin/aether.exe || true
          if [ -f "composeApp/src/desktopMain/resources/bin/psiphon-tunnel-core.exe" ]; then
            ./upx-4.2.4-win64/upx.exe --best --lzma composeApp/src/desktopMain/resources/bin/psiphon-tunnel-core.exe || true
          fi
          rm -rf upx.zip upx-4.2.4-win64

          echo "=== Check bin folder after UPX compression ==="
          ls -la composeApp/src/desktopMain/resources/bin

      - name: Build EXE and MSI
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-EXE
          path: composeApp/build/compose/binaries/main-release/exe/*.exe

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-MSI
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

      - name: Attach Windows Binaries to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main-release/exe/*.exe
            composeApp/build/compose/binaries/main-release/msi/*.msi
        continue-on-error: true
